# ---------------------------------------------------------------------------
# MedGuard (Triage One) — Render Blueprint
#
# This file makes the deployment configuration explicit and repeatable, so the
# service cannot be built against the wrong dependency file. It was added
# after a deployment failed with:
#
#     ModuleNotFoundError: No module named 'numpy'
#
# caused by a build command that installed only the web-framework packages
# while the API imports numpy/pandas/scikit-learn at request time.
#
# The model artifact (~250 MB) exceeds both GitHub's 100 MB per-file limit and
# Supabase Storage's 50 MB per-file limit, so it is stored xz-compressed
# (32 MB) in a private Supabase Storage bucket and restored by the service at
# startup. The digest is verified before the artifact is loaded.
#
# Deleting this file is safe: the same values can be entered manually in the
# Render dashboard (see docs/RENDER_DEPLOYMENT_FIX.md).
# ---------------------------------------------------------------------------

services:
  - type: web
    # MUST match the name of the existing Render service. Render matches a
    # blueprint service by name: if this were "medguard-api" instead, the
    # next push would CREATE A SECOND service rather than updating this one.
    name: MedGuard
    runtime: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt && python -m backend.ml.build_reports
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.8"

      # --- Model artifact delivery ------------------------------------------
      # The artifact is not committed. It is stored xz-compressed (~8 KB) in a
      # private Supabase Storage bucket and restored on startup, verified
      # against its SHA-256. The LogisticRegression model is small enough for
      # Render's free tier (512 MiB).
      - key: MEDGUARD_MODEL_URL
        value: https://tpzfaulcjcvleupjlufu.supabase.co/storage/v1/object/model-artifacts/triagegeist/v1.0/triage_model.joblib.xz
      - key: MEDGUARD_MODEL_SHA256
        value: df0d5de3a0405894b1e45eba210221f1c19be4bcb89788bef2ef59906510a4b4
      - key: MEDGUARD_MANIFEST_URL
        value: https://tpzfaulcjcvleupjlufu.supabase.co/storage/v1/object/model-artifacts/triagegeist/v1.0/triage_model.manifest.json
      - key: MEDGUARD_MANIFEST_SHA256
        value: 04ef6aa5c601ae1ab0f3ce1bf8b532659e3e411e6873c4a3d0516e14406f119b
      - key: MEDGUARD_ARTIFACT_DIR
        value: /tmp/medguard-artifacts

      # --- Model artifact paths (used when the artifact is on disk) ---------
      - key: MEDGUARD_MODEL_PATH
        value: models/triagegeist/triage_model.joblib
      - key: MEDGUARD_MANIFEST_PATH
        value: models/triagegeist/triage_model.manifest.json

      # --- Supabase (backend only) ----------------------------------------
      # The service-role key bypasses Row Level Security. It is a secret: it is
      # NOT stored here and NOT committed to the repository. Set it in the
      # Render dashboard under Environment Variables.
      - key: SUPABASE_URL
        value: https://tpzfaulcjcvleupjlufu.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # --- CORS ----------------------------------------------------------
      # The deployed Vercel frontend (production aliases) plus its preview
      # deployments, whose hashed hostnames are not known in advance.
      - key: MEDGUARD_CORS_ORIGINS
        value: https://med-guard-livid.vercel.app,https://med-guard-mambo-lits-projects.vercel.app
      - key: MEDGUARD_CORS_ORIGIN_REGEX
        value: https://med-guard-.*\.vercel\.app

      # --- Data ----------------------------------------------------------
      - key: MEDGUARD_DATA_ROOT
        value: triagegeist
